name: Skyward

options:
  bundleIdPrefix: com.dgmltn
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.2.1"
    CURRENT_PROJECT_VERSION: "3"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEVELOPMENT_TEAM: PAPMGT5WBR
    CODE_SIGN_STYLE: Automatic
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64

targets:
  Skyward:
    type: application
    platform: iOS
    sources:
      - Skyward
    dependencies:
      - target: SkywardWidget
        embed: true
    preBuildScripts:
      - name: Build SkywardKit (Kotlin)
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :app:embedAndSignAppleFrameworkForXcode
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dgmltn.skyward
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: Skyward
        TARGETED_DEVICE_FAMILY: "1"
        FRAMEWORK_SEARCH_PATHS: $(inherited) $(SRCROOT)/../app/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: $(inherited) -framework SkywardKit
    info:
      path: Skyward/Info.plist
      properties:
        CFBundleDisplayName: Skyward
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CADisableMinimumFrameDurationOnPhone: true
        NSLocationWhenInUseUsageDescription: Skyward uses your approximate location to work out sun and moon times.
        NSLocationDefaultAccuracyReduced: true
    entitlements:
      path: Skyward/Skyward.entitlements
      properties:
        com.apple.security.application-groups: [group.com.dgmltn.skyward]

  SkywardWidget:
    type: app-extension
    platform: iOS
    sources:
      - SkywardWidget
    preBuildScripts:
      - name: Build SkywardWidgetKit (Kotlin)
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :widget:embedAndSignAppleFrameworkForXcode
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dgmltn.skyward.widget
        PRODUCT_NAME: SkywardWidget
        TARGETED_DEVICE_FAMILY: "1"
        FRAMEWORK_SEARCH_PATHS: $(inherited) $(SRCROOT)/../widget/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: $(inherited) -framework SkywardWidgetKit
    info:
      path: SkywardWidget/Info.plist
      properties:
        CFBundleDisplayName: Skyward
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: SkywardWidget/SkywardWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.dgmltn.skyward]

schemes:
  Skyward:
    build:
      targets:
        Skyward: all
    run:
      config: Debug
    archive:
      config: Release
